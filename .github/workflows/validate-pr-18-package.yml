name: Validate PR 18 package

on:
  push:
    branches:
      - feat/17-preinspected-dependency-analysis

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/17-preinspected-dependency-analysis
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: npm pack --dry-run --json
      - run: bun run docs
