name: Bootstrap lockfile

on:
  push:
    branches:
      - feat/typescript-dependency-graph

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/typescript-dependency-graph

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Update and commit lockfile
        run: |
          bun install
          if git diff --quiet -- bun.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: update Bun lockfile [skip ci]"
          git push origin HEAD:feat/typescript-dependency-graph
